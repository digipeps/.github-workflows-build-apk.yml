
name: Build Perjuangan Semut APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="PerjuanganSemutAndroid-CloudBuild.zip"

          echo "Memeriksa file ZIP..."
          ls -lah

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP tidak ditemukan di root repository."
            exit 1
          fi

          echo "Memeriksa integritas ZIP..."
          unzip -t "$ZIP_FILE"

          echo "Mengekstrak proyek..."
          mkdir -p extracted
          unzip -oq "$ZIP_FILE" -d extracted

          PROJECT_DIR="extracted/PerjuanganSemutAndroid"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ]; then
            echo "ERROR: app/build.gradle tidak ditemukan."
            exit 1
          fi

          echo "Proyek Android berhasil ditemukan."
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          echo "Memulai kompilasi APK..."
          gradle --no-daemon --stacktrace :app:assembleDebug

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK tidak ditemukan setelah build."
            find app/build/outputs -type f || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/output/Perjuangan-Semut-Reborn.apk"

          echo "APK berhasil dibuat."
          ls -lh "$GITHUB_WORKSPACE/output/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perjuangan-Semut-Reborn-APK
          path: output/Perjuangan-Semut-Reborn.apk
          if-no-files-found: error
          retention-days: 14
