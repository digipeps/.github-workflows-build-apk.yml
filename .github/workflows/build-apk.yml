
name: Build Perjuangan Semut APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -q PerjuanganSemutAndroid-CloudBuild.zip -d extracted
          find extracted -name settings.gradle -print

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find extracted -name settings.gradle | head -n 1)")
          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Perjuangan-Semut-Reborn-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
