
name: Build Perjuangan Semut APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find and extract Android ZIP
        run: |
          set -e
          ZIP_FILE=$(find . -type f -iname "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP proyek Android tidak ditemukan."
            find . -maxdepth 3 -type f
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Build Android APK
        run: |
          set -e
          SETTINGS=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle tidak ditemukan."
            find extracted -maxdepth 4 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project: $PROJECT_DIR"

          cd "$PROJECT_DIR"
          gradle --no-daemon :app:assembleDebug

          APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          test -n "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Perjuangan-Semut-Reborn.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Perjuangan-Semut-Reborn-APK
          path: Perjuangan-Semut-Reborn.apk
          if-no-files-found: error
          
